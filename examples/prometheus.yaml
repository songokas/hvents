# yaml-language-server: $schema=../hvents.schema.json

events:
  schedule_metrics_calls:
    repeat: in 15 seconds
    next_event: send_metrics_to_prometheus
  send_metrics_to_prometheus:
    api_call: 
      url: http://localhost:9002/prometheus/metrics/
      method: post
      request_body: "{{otlp-metrics 60}}"
  local_metrics:
    api_listen:
      path: /local/metrics/
      response_body: "{{otlp-metrics 60}}"
  prometheus_metrics:
    api_listen:
      path: /prometheus/metrics/
      method: post
      request_content: text
      response_body: OK
    next_event: print_out
  print_local_metrics:
    api_call: http://localhost:9002/local/metrics/
    next_event: print_out
  print_out:
    print: stdout
http:
  default: localhost:9002

start_with:
  - schedule_metrics_calls
  - print_local_metrics
  - local_metrics
  - prometheus_metrics

metrics:
  instance_id: localhost:9002
